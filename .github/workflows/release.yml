name: Release macOS app

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish arm64 DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
      - run: node scripts/check-release-version.mjs
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: cargo fmt --check
      - run: cargo test --workspace
      - run: npm run tauri build -- --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: clinicians-veil-${{ github.ref_name }}-arm64-dmg
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
