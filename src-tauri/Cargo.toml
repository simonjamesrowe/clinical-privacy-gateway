[package]
name = "clinicians-veil"
version = "0.1.0"
description = "A local-first clinical privacy workspace"
authors = ["Simon Rowe"]
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.88"

[lib]
name = "clinicians_veil_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "~2.6.0", features = [] }

[dependencies]
clinicians-veil-core = { path = "../crates/clinicians-veil-core" }
clinicians-veil-ner = { path = "../crates/local-ner" }
arboard = { version = "3", default-features = false }
getrandom = "0.3"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled-sqlcipher"] }
security-framework = "3.7.0"
serde = { version = "1", features = ["derive"] }
tauri = { version = "~2.11.0", features = [] }

[dev-dependencies]
tempfile = "3"
