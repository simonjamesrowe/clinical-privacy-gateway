[package]
name = "clinicians-veil"
version = "0.1.0"
description = "A local-first clinical privacy workspace"
authors = ["Simon Rowe"]
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.88"

[lib]
name = "clinicians_veil_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "~2.6.0", features = [] }

[dependencies]
clinicians-veil-core = { path = "../crates/clinicians-veil-core" }
clinicians-veil-ner = { path = "../crates/local-ner" }
arboard = { version = "3", default-features = false }
getrandom = "0.3"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled-sqlcipher"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
security-framework = "3.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "~2.11.0", features = [] }
zip = { version = "6", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
base64 = "0.22"
rfd = "0.17"
png = "0.17"
genpdf = { version = "0.2.0", features = ["images"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-pdf-kit = "0.3"
